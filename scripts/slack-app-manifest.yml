display_information:
  name: Feature Agent
  description: Idea → evidence → PR → rollout pipeline
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: feature-agent
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - im:write
      - im:history
      - users:read
settings:
  event_subscriptions:
    request_url: https://YOUR-APP.vercel.app/api/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://YOUR-APP.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
